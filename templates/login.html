<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — LeafScan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest:   '#1E4D2B',
            sage:     '#4A7C59',
            moss:     '#7FB069',
            mist:     '#EEF4EE',
            cream:    '#F8FAF8',
            amber:    '#D4870A',
            stone:    '#6B7280',
            charcoal: '#1F2937',
          },
          fontFamily: {
            sans:    ['DM Sans', 'sans-serif'],
            display: ['DM Serif Display', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #E5E7EB;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-family: 'DM Sans', sans-serif;
      color: #1F2937;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #4A7C59;
      box-shadow: 0 0 0 3px rgba(74,124,89,0.12);
    }
    .input-field::placeholder { color: #9CA3AF; }

    .btn-primary {
      width: 100%;
      padding: 0.8rem 1rem;
      background: linear-gradient(135deg, #1E4D2B, #4A7C59);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-primary:hover  { opacity: 0.92; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.5s ease forwards; }

    .error-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: #DC2626;
      font-size: 0.85rem;
      display: none;
    }
    .error-box.visible { display: block; }
  </style>
</head>
<body class="font-sans bg-cream min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex min-h-[600px] fade-in">

    <div class="w-full lg:w-1/2 flex flex-col justify-center px-8 sm:px-12 py-12">
      <div class="mb-8">
        <a href="/" class="lg:hidden flex items-center gap-2 mb-8">
          <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-forest to-moss flex items-center justify-center">
            <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
            </svg>
          </div>
          <span class="font-display text-lg text-forest">LeafScan</span>
        </a>
        <h1 class="font-display text-3xl text-charcoal mb-1">Welcome back</h1>
        <p class="text-stone text-sm">Log in to your LeafScan account</p>
      </div>

      <div id="error-box" class="error-box mb-5"></div>

      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-charcoal mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" class="input-field"
                 placeholder="Enter your username" autocomplete="username" required />
        </div>

        <div>
          <label class="block text-sm font-medium text-charcoal mb-1.5" for="password">Password</label>
          <div class="relative">
            <input id="password" name="password" type="password" class="input-field pr-11"
                   placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" id="toggle-password"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-stone hover:text-forest transition-colors"
                    tabindex="-1">
              <svg id="eye-icon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn-primary mt-2">Log in</button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-stone text-sm">
          Don't have an account?
          <a href="/signup" class="text-forest font-semibold hover:underline ml-1">Sign up</a>
        </p>
      </div>

      <div class="mt-8 pt-6 border-t border-gray-100 text-center">
        <a href="/" class="inline-flex items-center gap-1.5 text-stone text-sm hover:text-forest transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to home
        </a>
      </div>
    </div>

    <div class="hidden lg:block lg:w-1/2 relative">
      <img src="https://plus.unsplash.com/premium_photo-1670758291967-25ed2e90f21e?q=80&w=800&auto=format&fit=crop"
           alt="Coffee plantation"
           class="w-full h-full object-cover" />
      <div class="absolute inset-0 bg-gradient-to-t from-forest/80 via-forest/30 to-transparent flex flex-col justify-between p-10">
        <a href="/" class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
            </svg>
          </div>
          <span class="font-display text-xl text-white">LeafScan</span>
        </a>

        <div>
          <p class="font-display text-3xl text-white leading-snug mb-4">
            Diagnose your plantation's diseases instantly
          </p>
          <div class="space-y-2.5">
            <div class="flex items-center gap-3 bg-white/10 backdrop-blur-sm rounded-xl px-4 py-3">
              <svg class="w-4 h-4 text-moss flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span class="text-white/85 text-sm">97.90% crop identification accuracy</span>
            </div>
            <div class="flex items-center gap-3 bg-white/10 backdrop-blur-sm rounded-xl px-4 py-3">
              <svg class="w-4 h-4 text-moss flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span class="text-white/85 text-sm">95.50% health classification accuracy</span>
            </div>
            <div class="flex items-center gap-3 bg-white/10 backdrop-blur-sm rounded-xl px-4 py-3">
              <svg class="w-4 h-4 text-moss flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
              <span class="text-white/85 text-sm">16 diseases covered across tea and coffee</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleBtn    = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon      = document.getElementById('eye-icon');

    toggleBtn.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      eyeIcon.innerHTML  = show
        ? `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>`
        : `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
    });

    const form      = document.getElementById('login-form');
    const errorBox  = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('visible');

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        errorBox.textContent = 'Please enter your username and password.';
        errorBox.classList.add('visible');
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        if (data.success) {
          window.location.href = data.redirect;
        } else {
          errorBox.textContent = data.message || 'Invalid username or password.';
          errorBox.classList.add('visible');
          submitBtn.disabled    = false;
          submitBtn.textContent = 'Log in';
        }
      } catch {
        errorBox.textContent = 'Something went wrong. Please try again.';
        errorBox.classList.add('visible');
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
